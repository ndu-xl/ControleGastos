<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de gastos</title>
<style>
:root{--papel:#edf1ec;--sup:#f8faf7;--tinta:#1f2a24;--suave:#5d6b62;--linha:#c9d3cb;--dest:#1e6b4a;--dest-t:#fff;--perigo:#b3382c}
:root[data-tema=escuro]{--papel:#141d18;--sup:#1b2620;--tinta:#e6ede8;--suave:#9aaba0;--linha:#2f4037;--dest:#5fbf93;--dest-t:#0e1a14;--perigo:#ee8b7f}
@media(prefers-color-scheme:dark){:root:not([data-tema=claro]){--papel:#141d18;--sup:#1b2620;--tinta:#e6ede8;--suave:#9aaba0;--linha:#2f4037;--dest:#5fbf93;--dest-t:#0e1a14;--perigo:#ee8b7f}}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:64rem;margin:auto;padding:1.5rem 1.25rem 4rem}
.topo{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:2px solid var(--tinta)}
h1{margin:0 auto 0 0;font-size:1.1rem}
button,input,select{font:inherit;color:var(--tinta)}
button{cursor:pointer;background:transparent;border:1px solid var(--tinta);border-radius:4px;padding:.45rem .85rem}
button.p{background:var(--dest);border-color:var(--dest);color:var(--dest-t);font-weight:600}
button.l{border:0;padding:.2rem .4rem;text-decoration:underline}
button.x{color:var(--perigo)}
:focus-visible{outline:2px solid var(--dest);outline-offset:2px}
input,select{background:var(--sup);border:1px solid var(--linha);border-radius:4px;padding:.45rem .6rem;min-width:0}
.kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border-bottom:1px solid var(--linha)}
.kpi{padding:1.1rem 1rem 1.1rem 0;min-width:0}.kpi+.kpi{padding-left:1rem;border-left:1px solid var(--linha)}
.kpi small{display:block;color:var(--suave)}
.kpi b{font-size:1.4rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.g b{font-size:clamp(2rem,6vw,3rem);line-height:1.1}
.kpi em{display:block;font-style:normal;color:var(--suave);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.graf{display:grid;grid-template-columns:1fr 1fr;gap:2rem;padding:1.5rem 0;border-bottom:1px solid var(--linha)}
h2{margin:0 0 .75rem;font-size:.95rem}
.cat{display:flex;gap:1.25rem;align-items:center}
svg.rosca{width:9.5rem;flex:none}
.leg{display:grid;gap:.1rem;flex:1;min-width:0}
.leg button{display:flex;gap:.5rem;align-items:center;border:0;text-align:left;padding:.2rem .3rem;width:100%}
.leg button[aria-pressed=true]{background:var(--sup);font-weight:600}
.leg.s button:not([aria-pressed=true]){opacity:.55}
.pt{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;flex:none}
td .pt{margin-right:.4rem}
.n1{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v1{font-variant-numeric:tabular-nums;color:var(--suave)}
.meses{display:flex;gap:.5rem;height:12rem}
.mes{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.25rem 0;border:0;border-radius:4px;background:transparent;color:var(--suave);font-size:.75rem}
.mes:hover{background:var(--sup)}
.mes[aria-pressed=true]{background:var(--sup);color:var(--tinta);font-weight:600}
.mes .vl{font-variant-numeric:tabular-nums;white-space:nowrap}
.mes .bar{position:relative;flex:1;width:100%;border-bottom:1px solid var(--linha)}
.mes .bar i{position:absolute;left:15%;right:15%;bottom:0;background:var(--dest);opacity:.4;border-radius:3px 3px 0 0}
.mes.at .bar i,.mes[aria-pressed=true] .bar i{opacity:1}
.nota{margin:.5rem 0 0;color:var(--suave);font-size:.8rem}
.barra{display:flex;gap:.5rem;flex-wrap:wrap;padding:1rem 0;align-items:center}
.barra input[type=search]{flex:1;min-width:10rem}
.barra .c{margin-left:auto;color:var(--suave)}
.tab{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:0;border-bottom:1px solid var(--tinta);text-align:left;font-weight:500;white-space:nowrap}
th button{border:0;color:var(--suave);padding:.5rem .5rem .5rem 0;font-size:.85rem}
th[aria-sort=ascending] button::after{content:" ↑"}th[aria-sort=descending] button::after{content:" ↓"}
th.n{text-align:right}th.n button{padding-right:0;padding-left:.5rem}
td{padding:.6rem .5rem .6rem 0;border-bottom:1px solid var(--linha)}
td.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
td.a{white-space:nowrap;text-align:right;padding-right:0}
.vz{color:var(--suave);padding:1.5rem 0}
dialog{background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);border-radius:6px;padding:1.25rem;width:min(26rem,calc(100% - 2rem))}
dialog::backdrop{background:#0008}
dialog form{display:grid;gap:.75rem}
dialog h2{font-size:1.05rem;margin:0}
label{display:grid;gap:.2rem;font-size:.85rem;color:var(--suave)}
.fim{display:flex;gap:.5rem;justify-content:flex-end}
#fe{color:var(--perigo);min-height:1.2rem;margin:0}
#toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:grid;gap:.5rem;z-index:9}
.t{background:var(--tinta);color:var(--papel);padding:.55rem .9rem;border-radius:4px}
.t.e{background:var(--perigo)}
@media(max-width:44rem){.kpis{grid-template-columns:1fr 1fr}.kpi.g{grid-column:1/-1}.kpi:nth-child(2),.kpi:nth-child(4){padding-left:0;border-left:0}.graf{grid-template-columns:1fr}.cat{flex-direction:column;align-items:stretch}svg.rosca{align-self:center}}
.aviso { color: var(--suave); font-size: .85rem; margin: .75rem 0 0; }
#progresso{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:linear-gradient(90deg,transparent,var(--dest),transparent) no-repeat;background-size:40% 100%;animation:corre 1.1s linear infinite}
@keyframes corre{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes gira{to{transform:rotate(360deg)}}
.giro,[aria-busy=true]::before{display:inline-block;width:1em;height:1em;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gira .7s linear infinite}
[aria-busy=true]::before{content:"";width:.8em;height:.8em;margin-right:.5em;vertical-align:-.1em}
.espera{display:flex;align-items:center;gap:.75rem;margin:1rem 0 0;padding:.75rem 1rem;border:1px solid var(--linha);border-radius:4px;background:var(--sup)}
.espera[hidden]{display:none}
tr.apagando{opacity:.5}
button:disabled,input:disabled{cursor:not-allowed;opacity:.6}
@media(prefers-reduced-motion:reduce){#progresso{animation:none;background:var(--dest)}.giro,[aria-busy=true]::before{animation-duration:2.5s}}
</style>
</head>
<body>
<main>
  <div class="topo">
    <h1>Controle de gastos</h1>
    <button id="tema">Alternar tema</button>
    <button id="csv">Exportar CSV</button>
    <button class="p" id="novo">Novo gasto</button>
  </div>
  <div class="espera" id="espera" role="status" hidden><span class="giro" aria-hidden="true"></span><span id="espera-txt"></span></div>
  <div id="progresso" hidden></div>
  <section class="kpis" id="kpis"></section>
  <section class="graf">
    <div><h2>Gastos por categoria</h2><div class="cat" id="cat"></div></div>
    <div><h2>Últimos 6 meses</h2><div class="meses" id="meses"></div><p class="nota" id="nota"></p></div>
  </section>

  <p class="aviso">Modo demonstração: seus gastos ficam visíveis só neste navegador. Não digite dados reais.</p>
  <div class="barra">
    <input type="search" id="q" placeholder="Buscar descrição ou categoria">
    <select id="fcat"></select>
    <input type="month" id="fmes">
    <button class="l" id="limpar">Limpar filtros</button>
    <span class="c" id="cont"></span>
  </div>
  <div class="tab">
    <table><thead><tr id="cab"></tr></thead><tbody id="lista"></tbody></table>
    <p class="vz" id="vz"></p>
  </div>
</main>

<dialog id="dlg">
  <form id="f">
    <h2 id="dt">Novo gasto</h2>
    <input type="hidden" id="id">
    <label>Descrição<input id="descricao" required></label>
    <label>Valor (R$)<input id="valor" type="number" step="0.01" min="0.01" required></label>
    <label>Categoria<input id="categoria" list="dl" required></label>
    <datalist id="dl"></datalist>
    <label>Data<input id="data" type="date"></label>
    <p id="fe" role="alert"></p>
    <div class="fim"><button type="button" id="cancelar">Cancelar</button><button class="p" type="submit">Salvar gasto</button></div>
  </form>
</dialog>
<div id="toasts"></div>

<script>
function obterVisitante() {
  try {
    let v = localStorage.getItem("visitante");
    if (!v) { v = crypto.randomUUID(); localStorage.setItem("visitante", v); }
    return v;
  } catch (e) {
    return crypto.randomUUID(); // sem localStorage, vale só até recarregar a página
  }
}
const VISITANTE = obterVisitante();
const API = "/gastos", $ = (i) => document.getElementById(i);
const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const S = { gastos: [], q: "", cat: "", mes: "", ord: "data", dir: -1, carregado: false };
let salvando = false, pendentes = 0;
const excluindo = new Set(); // ids com exclusão em andamento
const hoje = () => new Date().toLocaleDateString("sv-SE"); // AAAA-MM-DD no fuso local
const fmtData = (d) => (d ? d.split("-").reverse().join("/") : "-");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const soma = (l) => l.reduce((s, g) => s + g.valor, 0);

// ---------- Comunicação com o backend (GET, POST, PUT, DELETE em /gastos) ----------
async function api(url, op) {
  op = { ...op, headers: { ...(op && op.headers), "X-Visitante": VISITANTE } };
  try {
    const r = await fetch(url, op);
    return r.ok ? { r } : { msg: await lerErro(r) };
  } catch (e) {
    return { msg: "Sem conexão com o servidor. A aplicação Spring está rodando?" };
  }
}
async function lerErro(r) { // usa as mensagens que o Spring devolve (@NotBlank, 404...)
  try {
    const c = await r.json();
    if (c.errors && c.errors.length) return c.errors.map((e) => e.defaultMessage).join("; ");
    if (c.message) return c.message;
  } catch (e) {}
  return "Erro " + r.status;
}
async function carregar() {
  const primeira = !S.carregado;
  if (primeira) { $("novo").disabled = true; mostrarEspera("O Render está carregando, pode demorar até 50 segundos…"); }
  const x = await comProgresso(() => api(API));
  if (x.msg) aviso(x.msg, 1); else S.gastos = await x.r.json();
  S.carregado = true;
  if (primeira) { esconderEspera(); $("novo").disabled = false; }
  render();
}
async function excluir(g) {
  if (excluindo.has(g.id)) return; // já está excluindo: ignora o clique repetido
  if (!confirm("Excluir " + g.descricao + "?")) return;
  excluindo.add(g.id); render();
  const x = await comProgresso(() => api(API + "/" + g.id, { method: "DELETE" }), 5000);
  excluindo.delete(g.id);
  x.msg ? aviso(x.msg, 1) : aviso("Gasto excluído");
  carregar();
}
// Barra no topo enquanto houver requisição em andamento; após "dicaApos" ms avisa que pode demorar
async function comProgresso(fn, dicaApos) {
  pendentes++; $("progresso").hidden = false;
  const dica = dicaApos ? setTimeout(() => aviso("O Render está carregando, pode demorar até 50 segundos…"), dicaApos) : 0;
  try { return await fn(); }
  finally { clearTimeout(dica); if (--pendentes <= 0) $("progresso").hidden = true; }
}
function mostrarEspera(t) { $("espera-txt").textContent = t; $("espera").hidden = false; }
function esconderEspera() { $("espera").hidden = true; }
function travar(on) { // trava o formulário enquanto salva
  salvando = on;
  f.querySelectorAll("input").forEach((i) => (i.disabled = on));
  $("cancelar").disabled = on;
  const b = f.querySelector("button[type=submit]");
  b.disabled = on; b.textContent = on ? "Salvando…" : "Salvar gasto";
  if (on) b.setAttribute("aria-busy", "true"); else b.removeAttribute("aria-busy");
  $("fe").textContent = "";
}
function aviso(txt, erro) {
  const t = document.createElement("div");
  t.className = "t" + (erro ? " e" : ""); t.textContent = txt; t.setAttribute("role", "status");
  $("toasts").append(t); setTimeout(() => t.remove(), 3500);
}

// ---------- Tela: tudo é recalculado a partir de S.gastos + filtros ----------
function render() {
  const cats = [...new Set(S.gastos.map((g) => g.categoria))].sort((a, b) => a.localeCompare(b));
  const cor = (c) => `hsl(${(cats.indexOf(c) * 57 + 150) % 360} 48% 46%)`;
  const sel = $("fcat"); sel.innerHTML = ""; sel.add(new Option("Todas as categorias", ""));
  cats.forEach((c) => sel.add(new Option(c, c)));
  sel.value = cats.includes(S.cat) ? S.cat : (S.cat = "");
  $("dl").innerHTML = ""; cats.forEach((c) => $("dl").append(new Option(c)));

  const q = S.q.trim().toLowerCase();
  const base = S.gastos.filter((g) => (!S.mes || (g.data || "").startsWith(S.mes)) && (g.descricao + " " + g.categoria).toLowerCase().includes(q));
  const vis = base.filter((g) => !S.cat || g.categoria === S.cat);
  const k = S.ord, d = S.dir;
  vis.sort((a, b) => d * (k === "valor" ? a.valor - b.valor : String(a[k] || "").localeCompare(String(b[k] || ""), "pt-BR")));

  // Indicadores
  const total = soma(vis), mesAt = hoje().slice(0, 7);
  const maior = vis.reduce((m, g) => (!m || g.valor > m.valor ? g : m), null);
  $("kpis").innerHTML =
    `<div class="kpi g"><small>Total gasto</small><b>${brl.format(total)}</b><em>${vis.length} ${vis.length === 1 ? "lançamento" : "lançamentos"}</em></div>` +
    `<div class="kpi"><small>Este mês</small><b>${brl.format(soma(vis.filter((g) => (g.data || "").startsWith(mesAt))))}</b></div>` +
    `<div class="kpi"><small>Média por gasto</small><b>${brl.format(vis.length ? total / vis.length : 0)}</b></div>` +
    `<div class="kpi"><small>Maior gasto</small><b>${brl.format(maior ? maior.valor : 0)}</b><em>${maior ? esc(maior.descricao) : "-"}</em></div>`;

  // Rosca por categoria (ignora o filtro de categoria, para a legenda poder alternar)
  const por = {}; base.forEach((g) => (por[g.categoria] = (por[g.categoria] || 0) + g.valor));
  const bt = soma(base), lista = Object.entries(por).sort((a, b) => b[1] - a[1]);
  let acc = 0;
  const segs = lista.map(([c, v]) => {
    const p = (v / bt) * 100;
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${cor(c)}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${25 - acc}"/>`;
    acc += p; return s;
  }).join("");
  $("cat").innerHTML = lista.length
    ? `<svg class="rosca" viewBox="0 0 42 42" role="img" aria-label="Gastos por categoria"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--linha)" stroke-width="6"/>${segs}</svg>` +
      `<div class="leg${S.cat ? " s" : ""}">${lista.map(([c, v]) => `<button data-c="${esc(c)}" aria-pressed="${S.cat === c}" title="${brl.format(v)}"><i class="pt" style="background:${cor(c)}"></i><span class="n1">${esc(c)}</span><span class="v1">${Math.round((v / bt) * 100)}%</span></button>`).join("")}</div>`
    : `<p class="vz">Sem dados para exibir.</p>`;

  // Barras dos últimos 6 meses (ignora só o filtro de mês, para dar para clicar em outro mês)
  const doGrafico = S.gastos.filter((g) => (!S.cat || g.categoria === S.cat) && (g.descricao + " " + g.categoria).toLowerCase().includes(q));
  const meses = [];
  for (let i = 5; i >= 0; i--) { const dt = new Date(); dt.setDate(1); dt.setMonth(dt.getMonth() - i); meses.push(dt.toLocaleDateString("sv-SE").slice(0, 7)); }
  const tm = meses.map((m) => soma(doGrafico.filter((g) => (g.data || "").startsWith(m)))), mx = Math.max(...tm, 1);
  const curto = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", minimumFractionDigits: 0, maximumFractionDigits: 1 });
  $("meses").innerHTML = meses.map((m, i) => {
    const dt = new Date(m + "-02");
    const nome = dt.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "");
    const longo = dt.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const altura = tm[i] ? Math.max((tm[i] / mx) * 100, 2) : 0;
    return `<button class="mes${m === mesAt ? " at" : ""}" data-m="${m}" aria-pressed="${S.mes === m}" title="${longo}: ${brl.format(tm[i])}"><span class="vl">${tm[i] ? curto.format(tm[i]) : "–"}</span><span class="bar"><i style="height:${altura}%"></i></span><span class="ml">${nome}</span></button>`;
  }).join("");
  const fora = doGrafico.filter((g) => !meses.some((m) => (g.data || "").startsWith(m))).length;
  $("nota").textContent = "Clique em um mês para filtrar a tabela." + (fora ? " " + fora + " gasto(s) fora deste período não aparecem no gráfico." : "");

  // Tabela
  $("cab").innerHTML = [["data", "Data"], ["descricao", "Descrição"], ["categoria", "Categoria"], ["valor", "Valor", "n"]]
    .map(([c, t, n]) => `<th class="${n || ""}" aria-sort="${S.ord === c ? (S.dir > 0 ? "ascending" : "descending") : "none"}"><button data-o="${c}">${t}</button></th>`).join("") + "<th></th>";
  $("lista").innerHTML = vis.map((g) => { const ap = excluindo.has(g.id); return `<tr data-id="${g.id}"${ap ? ' class="apagando"' : ""}><td>${fmtData(g.data)}</td><td>${esc(g.descricao)}</td><td><i class="pt" style="background:${cor(g.categoria)}"></i>${esc(g.categoria)}</td><td class="n">${brl.format(g.valor)}</td><td class="a">${ap ? '<button class="l x" disabled aria-busy="true">Excluindo…</button>' : '<button class="l" data-a="e">Editar</button><button class="l x" data-a="x">Excluir</button>'}</td></tr>`; }).join("");
  $("vz").hidden = !!vis.length;
  $("vz").textContent = !S.carregado ? "Carregando…" : S.gastos.length ? "Nenhum gasto corresponde aos filtros." : "Nenhum gasto ainda. Clique em Novo gasto para adicionar o primeiro.";
  $("cont").textContent = vis.length + " de " + S.gastos.length;
}

// ---------- Interações ----------
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.c !== undefined) { S.cat = S.cat === b.dataset.c ? "" : b.dataset.c; render(); }
  else if (b.dataset.o) { S.dir = S.ord === b.dataset.o ? -S.dir : (b.dataset.o === "valor" || b.dataset.o === "data" ? -1 : 1); S.ord = b.dataset.o; render(); }
  else if (b.dataset.m) { S.mes = S.mes === b.dataset.m ? "" : b.dataset.m; $("fmes").value = S.mes; render(); }
  else if (b.dataset.a) { const g = S.gastos.find((x) => x.id == b.closest("tr").dataset.id); b.dataset.a === "e" ? abrir(g) : excluir(g); }
});
$("q").oninput = (e) => { S.q = e.target.value; render(); };
$("fcat").onchange = (e) => { S.cat = e.target.value; render(); };
$("fmes").onchange = (e) => { S.mes = e.target.value; render(); };
$("limpar").onclick = () => { S.q = S.cat = S.mes = ""; $("q").value = $("fmes").value = ""; render(); };

const dlg = $("dlg"), f = $("f");
function abrir(g) {
  f.reset(); $("fe").textContent = ""; $("id").value = g ? g.id : "";
  $("dt").textContent = g ? "Editar gasto" : "Novo gasto";
  if (g) { $("descricao").value = g.descricao; $("valor").value = g.valor; $("categoria").value = g.categoria; }
  $("data").value = g && g.data ? g.data : hoje();
  dlg.showModal(); $("descricao").focus();
}
$("novo").onclick = () => abrir();
$("cancelar").onclick = () => dlg.close();
f.onsubmit = async (e) => {
  e.preventDefault(); // não deixa o navegador recarregar a página
  if (salvando) return; // ignora segundo clique ou Enter enquanto espera a resposta
  const id = $("id").value;
  const gasto = { descricao: $("descricao").value, valor: Number($("valor").value), categoria: $("categoria").value, data: $("data").value || null };
  travar(true);
  const x = await comProgresso(() => api(id ? API + "/" + id : API, { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(gasto) }), 5000);
  travar(false);
  if (x.msg) { $("fe").textContent = x.msg; return; }
  dlg.close(); aviso(id ? "Gasto atualizado" : "Gasto adicionado"); carregar();
};
dlg.addEventListener("cancel", (e) => { if (salvando) e.preventDefault(); }); // Esc não fecha enquanto salva

$("csv").onclick = () => {
  const l = [["Data", "Descrição", "Categoria", "Valor"], ...S.gastos.map((g) => [g.data || "", g.descricao, g.categoria, String(g.valor).replace(".", ",")])];
  const txt = "\uFEFF" + l.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = "gastos.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

$("tema").onclick = () => {
  const r = document.documentElement, escuro = matchMedia("(prefers-color-scheme:dark)").matches;
  const novo = (r.dataset.tema || (escuro ? "escuro" : "claro")) === "escuro" ? "claro" : "escuro";
  r.dataset.tema = novo; try { localStorage.setItem("tema", novo); } catch (e) {}
};
try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}

render(); carregar();
</script>
